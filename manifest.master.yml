plugin:
  name: custom-data-type-loc
  version: 2.0
  url: https://github.com/programmfabrik/fylr-plugin-custom-data-type-loc
  displayname:
    de-DE: LoC-Verknüpfung
    en-US: LoC-Referencing
  info:
    de-DE: |
      Ergänzt fylr um einen Feldtyp, mit dem sich Datensätze mit Normdaten der [Library of Congress](https://id.loc.gov/) verknüpfen lassen. Standardmäßig werden die LC Subject Headings durchsucht; das Zielvokabular ist jedoch konfigurierbar – etwa Namensnormdaten, der Thesaurus for Graphic Materials oder die MARC-Sprachen. Redakteure wählen einen Eintrag aus den Autocomplete-Vorschlägen im Maskenfeld, und ein Updater kann verknüpfte Einträge aktuell halten.
    en-US: |
      Adds a custom data type for linking records to authority data published by the [Library of Congress](https://id.loc.gov/). By default it searches LC Subject Headings, but the target scheme is configurable — for example Name Authorities, the Thesaurus for Graphic Materials, or MARC Languages. Editors pick an entry from autocomplete suggestions in a mask field, and an updater can keep linked entries in sync.
  l10n: l10n/customDataTypeLoc.csv
  webfrontend:
    url: customDataTypeLoc.js
    css: customDataTypeLoc.css
    dependencies:
      - commons-library

base_url_prefix: "webfrontend"

custom_types:
  loc:
    mapping:
      conceptName:
        type: text
      conceptURI:
        type: text
        skipTerms: true
      facetTerm:
        type: text_l10n
        skipTerms: true
    config:
      schema:
        - name: schema
          parameters:
            value:
              type: text
      mask:
        - name: editor_display
          parameters:
            value:
              type: select
              options: ["default", "condensed"]

    update:
      plugin_user:
        reference: system:root
      exec:
        service: "node"
        commands:
          - prog: "node"
            stdin:
              type: body
            stdout:
              type: body
            args:
              - type: "value"
                value: "%_exec.pluginDir%/updater/LocUpdater.js"
              - type: "value"
                value: "%info.json%"
      timeout: 60
      batch_size: 1
      expires_days: 1

base_config:
  - name: update_loc
    group: update_custom_data_type
    parameters:
      restrict_time:
        type: bool
        default: false
        position: 0
      from_time:
        type: int
        default: 19
        min: 0
        max: 24
        position: 1
      to_time:
        type: int
        default: 4
        min: 0
        max: 24
        position: 2
      custom_expires_days:
        type: int
        min: 1
        default: 1
        position: 3
